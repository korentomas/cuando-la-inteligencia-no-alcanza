<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Qué problemas queremos resolver?</title>
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:400;src:url(vendor/fonts/bricolage-grotesque-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;src:url(vendor/fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 10%,#1b2a6b 0,#03040a 60%);color:#eef1ff;font:18px/1.4 "Bricolage Grotesque",system-ui,sans-serif;padding:32px 20px}
main{max-width:460px;margin:0 auto}
h1{font-size:34px;line-height:1.05;margin:0 0 12px;letter-spacing:-.02em}
p{color:#a7aed4;margin:0 0 24px}
label{display:block;font-size:15px;color:#a7aed4;margin:18px 0 6px}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:1px solid #2c3468;background:#0b0e1c;color:#eef1ff;outline:none}
input:focus{border-color:#7d97ff;box-shadow:0 0 0 3px rgba(125,151,255,.25)}
button{margin-top:26px;width:100%;font:800 20px "Bricolage Grotesque";padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#6f9bff,#3d63f0);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
#msg{margin-top:18px;min-height:1.4em;color:#ff8a7a}
.done h1{color:#9cc2ff}
</style>
</head>
<body>
<main id="app">
  <h1>¿Qué problemas te parece importante resolver como humanidad?</h1>
  <p>Escribí uno o dos. Aparecen en la pantalla, sin tu nombre.</p>
  <form id="f">
    <label for="a">Problema 1</label><input id="a" maxlength="60" autocomplete="off" required>
    <label for="b">Problema 2 (opcional)</label><input id="b" maxlength="60" autocomplete="off">
    <button id="go">Mandar</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.onsubmit = async e => {
  e.preventDefault(); go.disabled = true; msg.textContent = '';
  const respuestas = [f.a.value, f.b.value].map(s => s.trim()).filter(Boolean);
  try {
    const r = await fetch('api/respuestas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ respuestas }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'No se pudo mandar.');
    document.getElementById('app').className = 'done';
    document.getElementById('app').innerHTML = '<h1>¡Gracias!</h1><p>Mirá la pantalla.</p>';
  } catch (err) { msg.textContent = err.message; go.disabled = false; }
};
</script>
</body>
</html>
